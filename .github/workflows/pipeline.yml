name: RadarGov - pipeline de ingestao

# Roda todo dia as 06:00 (horario UTC = 03:00 em Brasilia)
# e tambem pode ser disparado manualmente na aba "Actions".
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write        # necessario para o passo de commit da base atualizada

jobs:
  ingestao:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Coleta dos dados
        run: python src/coleta.py

      - name: Relatorio de qualidade
        run: python src/qualidade.py

      - name: Tratamento (base curada)
        run: python src/tratamento.py

      - name: Calculo dos indicadores
        run: python src/indicadores.py

      - name: Sinalizacao de despesa atipica
        run: python src/sinalizacao.py

      - name: Testes automatizados dos indicadores
        run: python src/testes_indicadores.py

      - name: Commit da base atualizada
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/bruto dados/tratado
          git commit -m "Atualizacao automatica da base ($(date -u +%Y-%m-%d))" || echo "Sem mudancas para commitar."
          git push
