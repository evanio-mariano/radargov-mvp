name: RadarGov - ranking de favorecidos (infraestrutura)

# Roda toda semana (domingo, 07:00 UTC) e tambem pode ser disparado
# manualmente na aba "Actions". Separado do pipeline diario porque esta
# coleta e bem mais lenta (percorre muitas paginas da API do Portal).
on:
  schedule:
    - cron: "0 7 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  favorecidos:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Coleta do ranking de favorecidos
        env:
          PORTAL_API_KEY: ${{ secrets.PORTAL_API_KEY }}
        run: python src/coleta_favorecidos.py

      - name: Commit da base atualizada
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/bruto/favorecidos_infraestrutura_bruto.parquet dados/tratado/ranking_favorecidos_infraestrutura.md
          git commit -m "Atualizacao automatica do ranking de favorecidos ($(date -u +%Y-%m-%d))" || echo "Sem mudancas para commitar."
          git push
